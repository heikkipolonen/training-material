# CI-ajo jokaisesta main-haaraan päätyvästä muutoksesta.
trigger:
  branches:
    include:
      - main

# HUOM: Azure Repos Git ei käytä YAML:n `pr:`-triggeriä. PR-ajot käynnistää
# main-haaran Branch policy → Build validation (ks. oppitunnit/01-hyvaksytyt-kirjastot.md, kohta D).
# Siksi PR-triggeri on tässä tarkoituksella pois päältä, ettei se johda harhaan.
pr: none

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  clean: true

- task: UsePythonVersion@0
  displayName: Käytä Python 3.11
  inputs:
    versionSpec: '3.11'

# Kaikki asennukset tehdään lukitustiedostoista:
#   --require-hashes   jokaisen paketin (myös transitiivisen) hash tarkistetaan
#   --only-binary :all: vain valmiit paketit (wheel), pakettien build-koodia ei ajeta

# Asennetaan ensin VAIN tarkastusten tarvitsemat paketit (PyYAML ja uv).
# Lista on pidetty mahdollisimman lyhyenä, koska nämä asennetaan ennen kuin
# tarkastus on ehtinyt hylätä mitään.
- script: 'python -m pip install --require-hashes --only-binary :all: -r requirements-bootstrap.lock.txt'
  displayName: Asenna tarkastusten riippuvuudet

# Tarkastaa requirements.txt:n, requirements-dev.txt:n ja requirements-bootstrap.txt:n:
# jokainen riippuvuus on lukittu tarkkaan versioon, ja versio on hyväksytty.
# --azure-devops: hylkäyksen syyt näkyvät PR:n tarkastusnäkymässä luettavina
# virheinä, ja task merkitään epäonnistuneeksi logging-komennolla.
- script: python scripts/check_approved_libraries.py --azure-devops
  displayName: Tarkasta hyväksytyt kirjastot ja versiot

# Sama sääntö ajetaan myös pre-commit-hookina, mutta hookin voi ohittaa
# (--no-verify). Pipelinessa sitä ei voi ohittaa.
- script: python scripts/check_precommit_config.py --azure-devops
  displayName: Tarkasta pre-commit-hookit

# Lukitustiedostojen pitää vastata requirements-tiedostoja. Muuten PR voisi
# lisätä paketin suoraan lukitustiedostoon ohi hyväksyntätarkastuksen.
- script: python scripts/lock_files.py check --azure-devops
  displayName: Tarkasta lukitustiedostot

# Kehitystyökalut asennetaan vasta, kun ne on todettu hyväksytyiksi.
- script: 'python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock.txt'
  displayName: Asenna kehitystyökalut

- script: python -m pytest --junitxml=test-results/junit.xml
  displayName: Testaa tarkastussääntö

- task: PublishTestResults@2
  condition: succeededOrFailed()
  displayName: Julkaise testitulokset
  inputs:
    testResultsFormat: JUnit
    testResultsFiles: test-results/junit.xml
    testRunTitle: Tarkastussäännön testit
    failTaskOnMissingResultsFile: false

# Lukitustiedostot ovat osa evidenssiä: ne kertovat tarkalleen, mitä asennettiin.
- script: mkdir -p artifacts && cp requirements*.lock.txt artifacts/
  condition: always()
  displayName: Lisää lukitustiedostot evidenssiin

# Raportti julkaistaan myös hylätystä ajosta (condition: always()).
- task: PublishPipelineArtifact@1
  condition: always()
  displayName: Julkaise auditointievidenssi
  inputs:
    targetPath: artifacts
    artifact: approved-libraries-audit-evidence
