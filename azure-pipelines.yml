# CI-ajo jokaisesta main-haaraan päätyvästä muutoksesta.
trigger:
  branches:
    include:
      - main

# HUOM: Azure Repos Git ei käytä YAML:n `pr:`-triggeriä. PR-ajot käynnistää
# main-haaran Branch policy → Build validation (ks. koulutusprosessi.md, kohta E).
# Siksi PR-triggeri on tässä tarkoituksella pois päältä, ettei se johda harhaan.
pr: none

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  clean: true

- task: UsePythonVersion@0
  displayName: Käytä Python 3.11
  inputs:
    versionSpec: '3.11'

# Asennetaan ensin VAIN tarkastusskriptin tarvitsema PyYAML. Paketti on nimetty
# tässä eikä luettu requirements-dev.txt:stä, jotta PR ei voi asentaa agentille
# hyväksymätöntä pakettia ennen kuin tarkastus on ehtinyt hylätä sen.
- script: python -m pip install pyyaml
  displayName: Asenna tarkastusskriptin riippuvuus

# Tarkastaa sekä requirements.txt:n että requirements-dev.txt:n.
# --azure-devops: hylkäyksen syyt näkyvät PR:n tarkastusnäkymässä luettavina
# virheinä, ja task merkitään epäonnistuneeksi logging-komennolla.
- script: python scripts/check_approved_libraries.py --azure-devops
  displayName: Tarkasta hyväksytyt kirjastot

# Sama sääntö ajetaan myös pre-commit-hookina, mutta hookin voi ohittaa
# (--no-verify). Pipelinessa sitä ei voi ohittaa.
- script: python scripts/check_precommit_config.py --azure-devops
  displayName: Tarkasta pre-commit-hookien alkuperä

# Kehitystyökalut asennetaan vasta, kun ne on todettu hyväksytyiksi.
- script: python -m pip install -r requirements-dev.txt
  displayName: Asenna kehitystyökalut

- script: python -m pytest --junitxml=test-results/junit.xml
  displayName: Testaa tarkastussääntö

- task: PublishTestResults@2
  condition: succeededOrFailed()
  displayName: Julkaise testitulokset
  inputs:
    testResultsFormat: JUnit
    testResultsFiles: test-results/junit.xml
    testRunTitle: Tarkastussäännön testit
    failTaskOnMissingResultsFile: false

# Raportti julkaistaan myös hylätystä ajosta (condition: always()).
- task: PublishPipelineArtifact@1
  condition: always()
  displayName: Julkaise auditointievidenssi
  inputs:
    targetPath: artifacts
    artifact: approved-libraries-audit-evidence
